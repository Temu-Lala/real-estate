
name: Build Next.js for Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build standalone application
        run: pnpm build

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deploy
          cp -a .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then
            cp -a public deploy/public
          fi
          tar -czf real-estate-linux.tar.gz -C deploy .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-linux
          path: real-estate-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
