
name: Build and Deploy Real Estate

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: real-estate-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      # 3. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Build Next.js
      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ''

      # 6. Package standalone build
      - name: Package standalone build
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Validating Next.js standalone output..."

          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/static

          echo "Preparing deployment package..."

          rm -rf deploy
          mkdir -p deploy/.next/static

          # Copy standalone server and production dependencies
          cp -a .next/standalone/. deploy/

          # Copy Next.js static assets
          cp -a .next/static/. deploy/.next/static/

          # Copy public assets without overwriting other server data
          if [ -d public ]; then
            mkdir -p deploy/public
            cp -a public/. deploy/public/
          fi

          # Validate deployment package
          test -f deploy/server.js
          test -f deploy/package.json
          test -d deploy/node_modules
          test -f deploy/.next/BUILD_ID

          # Create archive
          tar -czf real-estate-linux.tar.gz -C deploy .

          echo "Deployment package created."
          ls -lh real-estate-linux.tar.gz

      # 7. Configure SSH
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          # Validate secrets
          test -n "$SSH_KEY" || {
            echo "CPANEL_SSH_KEY is missing."
            exit 1
          }

          test -n "$CPANEL_HOST" || {
            echo "CPANEL_HOST is missing."
            exit 1
          }

          test -n "$CPANEL_USER" || {
            echo "CPANEL_USER is missing."
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key and normalize Windows line endings
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate private key format
          echo "Validating SSH private key..."

          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub

          echo "Private key is valid."

          echo "Deployment key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub

          # Add server host key
          ssh-keyscan -H -T 15 "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      # 8. Test cPanel SSH connectivity and authentication
      - name: Test cPanel SSH connectivity
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          echo "Testing cPanel SSH port..."

          nc -vz -w 15 "$CPANEL_HOST" 22

          echo "Testing SSH authentication..."

          ssh -vv \
            -p 22 \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
            -i ~/.ssh/deploy_key \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo SSH_CONNECTION_SUCCESS && whoami"

          echo "SSH connectivity and authentication successful."

      # 9. Upload deployment archive
      - name: Upload frontend build
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          APP_DIR="/home/appartme/real-estate"
          ARCHIVE="real-estate-linux.tar.gz"

          echo "Uploading frontend build..."

          scp \
            -P 22 \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
            "$ARCHIVE" \
            "$CPANEL_USER@$CPANEL_HOST:$APP_DIR/$ARCHIVE"

          echo "Frontend archive uploaded successfully."

      # 10. Deploy frontend on cPanel
      - name: Deploy to cPanel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -p 22 \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
            "$CPANEL_USER@$CPANEL_HOST" \
            'bash -s' <<'REMOTE'

          set -Eeuo pipefail

          APP_DIR="/home/appartme/real-estate"
          ARCHIVE="$APP_DIR/real-estate-linux.tar.gz"
          STAGE="$APP_DIR/deploy-staging"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$APP_DIR/.next-backup-$TIMESTAMP"
          NODE_BACKUP="$APP_DIR/.node_modules-backup-$TIMESTAMP"

          cd "$APP_DIR"

          echo "Starting frontend deployment..."

          # Ensure deployment archive exists
          test -s "$ARCHIVE"

          # Validate archive before extraction
          tar -tzf "$ARCHIVE" >/dev/null

          # Prepare clean staging directory
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Extract new build
          tar -xzf "$ARCHIVE" -C "$STAGE"

          # Validate extracted standalone build
          test -f "$STAGE/server.js"
          test -f "$STAGE/package.json"
          test -d "$STAGE/node_modules"
          test -f "$STAGE/.next/BUILD_ID"

          echo "Standalone build validated."

          # Preserve existing build
          if [ -d "$APP_DIR/.next" ]; then
            mv "$APP_DIR/.next" "$BACKUP"
          fi

          # Install new Next.js build
          if ! mv "$STAGE/.next" "$APP_DIR/.next"; then
            echo "New build installation failed."

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$APP_DIR/.next"
            fi

            exit 1
          fi

          # Update standalone server
          cp -f "$STAGE/server.js" "$APP_DIR/server.js"
          cp -f "$STAGE/package.json" "$APP_DIR/package.json"

          # Replace production dependencies
          if [ -d "$STAGE/node_modules" ]; then

            if [ -d "$APP_DIR/node_modules" ]; then
              mv "$APP_DIR/node_modules" "$NODE_BACKUP"
            fi

            if ! mv "$STAGE/node_modules" "$APP_DIR/node_modules"; then
              echo "Dependency installation failed."

              if [ -d "$NODE_BACKUP" ]; then
                mv "$NODE_BACKUP" "$APP_DIR/node_modules"
              fi

              rm -rf "$APP_DIR/.next"

              if [ -d "$BACKUP" ]; then
                mv "$BACKUP" "$APP_DIR/.next"
              fi

              exit 1
            fi
          fi

          # Update public assets if included
          if [ -d "$STAGE/public" ]; then
            mkdir -p "$APP_DIR/public"
            cp -a "$STAGE/public/." "$APP_DIR/public/"
          fi

          # Verify installed build
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/.next/BUILD_ID"
          test -d "$APP_DIR/node_modules"

          echo "Frontend files installed successfully."

          # Restart Passenger
          mkdir -p "$APP_DIR/tmp"
          touch "$APP_DIR/tmp/restart.txt"

          # Clean temporary deployment files
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"

          # Remove previous backups after successful installation
          rm -rf "$BACKUP"
          rm -rf "$NODE_BACKUP"

          echo "======================================"
          echo "FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Application: $APP_DIR"
          echo "Passenger restart: Requested"
          echo "Go API: Preserved"
          echo "API environment: Preserved"
          echo "Uploaded data: Preserved"

          REMOTE

      # 11. Deployment summary
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Real Estate Deployment Successful"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| Next.js build | Successful |"
            echo "| SSH authentication | Successful |"
            echo "| Frontend upload | Successful |"
            echo "| Frontend installation | Successful |"
            echo "| Passenger restart request | Sent |"
            echo "| Go API and existing data | Preserved |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 12. Failure summary
      - name: Deployment failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Real Estate Deployment Failed"
            echo ""
            echo "One or more deployment steps failed."
            echo "Open the failed step above to inspect the error."
          } >> "$GITHUB_STEP_SUMMARY"
