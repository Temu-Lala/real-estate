
name: Build and Deploy Real Estate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://appartmentsinaddisababa.com/api

      - name: Package standalone build
        run: |
          mkdir -p deploy
          cp -a .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then
            cp -a public deploy/public
          fi
          tar -czf real-estate-linux.tar.gz -C deploy .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to cPanel
        run: |
          scp -i ~/.ssh/deploy_key real-estate-linux.tar.gz \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/appartme/real-estate/real-estate-linux.tar.gz

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            'cd /home/appartme/real-estate &&
             mkdir -p .next &&
             tar -xzf real-estate-linux.tar.gz &&
             rm -f real-estate-linux.tar.gz &&
             echo "Deployment files extracted"'
