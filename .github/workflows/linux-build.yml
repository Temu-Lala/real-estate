
name: Build and Deploy Real Estate

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: real-estate-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      # 3. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Build Next.js
      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ''

      # 6. Package standalone build
      - name: Package standalone build
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Validating Next.js standalone output..."

          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/static

          echo "Preparing deployment package..."

          rm -rf deploy
          mkdir -p deploy/.next/static

          # Copy standalone server and production dependencies
          cp -a .next/standalone/. deploy/

          # Copy Next.js static assets
          cp -a .next/static/. deploy/.next/static/

          # Copy public assets
          if [ -d public ]; then
            mkdir -p deploy/public
            cp -a public/. deploy/public/
          fi

          # Validate deployment package
          test -f deploy/server.js
          test -f deploy/package.json
          test -d deploy/node_modules
          test -f deploy/.next/BUILD_ID

          # Create archive
          tar -czf real-estate-linux.tar.gz -C deploy .

          echo "Deployment package created."
          ls -lh real-estate-linux.tar.gz

      # 7. Configure SSH and decrypt private key
      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          echo "Validating required secrets..."

          test -n "$SSH_KEY" || {
            echo "CPANEL_SSH_KEY is missing."
            exit 1
          }

          test -n "$SSH_PASSPHRASE" || {
            echo "CPANEL_SSH_PASSPHRASE is missing."
            exit 1
          }

          test -n "$CPANEL_HOST" || {
            echo "CPANEL_HOST is missing."
            exit 1
          }

          test -n "$CPANEL_USER" || {
            echo "CPANEL_USER is missing."
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Write private key and normalize Windows line endings
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Decrypting SSH private key..."

          # Remove passphrase from temporary runner copy only
          ssh-keygen -p \
            -P "$SSH_PASSPHRASE" \
            -N "" \
            -f "$HOME/.ssh/deploy_key" \
            -q

          echo "Validating decrypted private key..."

          ssh-keygen -y \
            -P "" \
            -f "$HOME/.ssh/deploy_key" \
            > "$HOME/.ssh/deploy_key.pub"

          chmod 600 "$HOME/.ssh/deploy_key.pub"

          echo "Private key validated successfully."

          echo "Deployment key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key.pub"

          # Add server host key
          ssh-keyscan -H -T 15 "$CPANEL_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null

          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."

      # 8. Test cPanel SSH connectivity and authentication
      - name: Test cPanel SSH connectivity
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          echo "Testing cPanel SSH port..."

          nc -vz -w 20 "$CPANEL_HOST" 22

          echo "Testing SSH authentication..."

          ssh \
            -vv \
            -p 22 \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
            -i "$HOME/.ssh/deploy_key" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "echo SSH_CONNECTION_SUCCESS && whoami"

          echo "SSH connectivity and authentication successful."

      # 9. Upload deployment archive with retries
      - name: Upload frontend build
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          APP_DIR="/home/appartme/real-estate"
          ARCHIVE="real-estate-linux.tar.gz"

          test -s "$ARCHIVE"

          echo "Uploading frontend build..."

          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."

            if nc -vz -w 20 "$CPANEL_HOST" 22; then

              if scp \
                -P 22 \
                -i "$HOME/.ssh/deploy_key" \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
                "$ARCHIVE" \
                "$CPANEL_USER@$CPANEL_HOST:$APP_DIR/$ARCHIVE"; then

                echo "Frontend archive uploaded successfully."
                exit 0
              fi

            else
              echo "SSH port 22 is unreachable."
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "ERROR: Upload failed after 3 attempts."
          exit 1

      # 10. Deploy frontend on cPanel
      - name: Deploy to cPanel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -p 22 \
            -i "$HOME/.ssh/deploy_key" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PubkeyAcceptedAlgorithms=rsa-sha2-512,rsa-sha2-256 \
            "$CPANEL_USER@$CPANEL_HOST" \
            'bash -s' <<'REMOTE'

          set -Eeuo pipefail

          APP_DIR="/home/appartme/real-estate"
          ARCHIVE="$APP_DIR/real-estate-linux.tar.gz"
          STAGE="$APP_DIR/deploy-staging"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"

          BACKUP="$APP_DIR/.next-backup-$TIMESTAMP"
          NODE_BACKUP="$APP_DIR/.node_modules-backup-$TIMESTAMP"
          SERVER_BACKUP="$APP_DIR/.server-backup-$TIMESTAMP"
          PACKAGE_BACKUP="$APP_DIR/.package-backup-$TIMESTAMP"

          cd "$APP_DIR"

          echo "Starting frontend deployment..."

          # Validate archive
          test -s "$ARCHIVE"
          tar -tzf "$ARCHIVE" >/dev/null

          # Prepare clean staging directory
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Extract new build
          tar -xzf "$ARCHIVE" -C "$STAGE"

          # Validate extracted standalone build
          test -f "$STAGE/server.js"
          test -f "$STAGE/package.json"
          test -d "$STAGE/node_modules"
          test -f "$STAGE/.next/BUILD_ID"

          echo "Standalone build validated."

          # Backup current files
          [ ! -d "$APP_DIR/.next" ] || mv "$APP_DIR/.next" "$BACKUP"
          [ ! -d "$APP_DIR/node_modules" ] || mv "$APP_DIR/node_modules" "$NODE_BACKUP"
          [ ! -f "$APP_DIR/server.js" ] || cp -a "$APP_DIR/server.js" "$SERVER_BACKUP"
          [ ! -f "$APP_DIR/package.json" ] || cp -a "$APP_DIR/package.json" "$PACKAGE_BACKUP"

          rollback() {
            echo "Deployment failed. Restoring previous frontend..."

            rm -rf "$APP_DIR/.next" "$APP_DIR/node_modules"

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$APP_DIR/.next"
            fi

            if [ -d "$NODE_BACKUP" ]; then
              mv "$NODE_BACKUP" "$APP_DIR/node_modules"
            fi

            if [ -f "$SERVER_BACKUP" ]; then
              cp -a "$SERVER_BACKUP" "$APP_DIR/server.js"
            fi

            if [ -f "$PACKAGE_BACKUP" ]; then
              cp -a "$PACKAGE_BACKUP" "$APP_DIR/package.json"
            fi
          }

          # Install new frontend files
          if ! mv "$STAGE/.next" "$APP_DIR/.next"; then
            rollback
            exit 1
          fi

          if ! mv "$STAGE/node_modules" "$APP_DIR/node_modules"; then
            rollback
            exit 1
          fi

          if ! cp -f "$STAGE/server.js" "$APP_DIR/server.js"; then
            rollback
            exit 1
          fi

          if ! cp -f "$STAGE/package.json" "$APP_DIR/package.json"; then
            rollback
            exit 1
          fi

          # Update public assets without deleting unrelated files
          if [ -d "$STAGE/public" ]; then
            mkdir -p "$APP_DIR/public"
            cp -a "$STAGE/public/." "$APP_DIR/public/"
          fi

          # Verify installation
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/.next/BUILD_ID"
          test -d "$APP_DIR/node_modules"

          echo "Frontend files installed successfully."

          # Restart Passenger
          mkdir -p "$APP_DIR/tmp"
          touch "$APP_DIR/tmp/restart.txt"

          # Clean staging and archive
          rm -rf "$STAGE"
          rm -f "$ARCHIVE"

          # Remove backups after successful deployment
          rm -rf "$BACKUP"
          rm -rf "$NODE_BACKUP"
          rm -f "$SERVER_BACKUP" "$PACKAGE_BACKUP"

          echo "======================================"
          echo "FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Application: $APP_DIR"
          echo "Passenger restart: Requested"
          echo "Go API: Preserved"
          echo "API environment: Preserved"
          echo "Uploaded data: Preserved"

          REMOTE

      # 11. Deployment summary
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Real Estate Deployment Successful"
            echo ""
            echo "| Component | Status |"
            echo "|---|---|"
            echo "| Next.js build | Successful |"
            echo "| SSH authentication | Successful |"
            echo "| Frontend upload | Successful |"
            echo "| Frontend installation | Successful |"
            echo "| Passenger restart request | Sent |"
            echo "| Go API and existing data | Preserved |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 12. Failure summary
      - name: Deployment failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Real Estate Deployment Failed"
            echo ""
            echo "One or more deployment steps failed."
            echo "Open the failed step above to inspect the error."
          } >> "$GITHUB_STEP_SUMMARY"
